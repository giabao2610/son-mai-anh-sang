<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="dg-at-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-at-title">Ánh trăng chiếu song song từ phía trăng. Cây hoa chắn sáng nên đổ bóng xuống lá (shadow map). Ở mép cánh, pháp tuyến N gần vuông góc với hướng nhìn V, nên mép cánh sáng lên (fresnel).</title>
  <defs>
    <marker id="dg-at-mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F2D48A"/>
    </marker>
    <marker id="dg-at-mui2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D4A94A"/>
    </marker>
  </defs>
  <!-- trăng và các tia song song -->
  <circle cx="34" cy="30" r="16" fill="#EDE3CF"/>
  <path d="M34 14 A16 16 0 0 0 34 46 A9 16 0 0 1 34 14 Z" fill="#1B2A4A"/>
  <g stroke="#F2D48A" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <path d="M52 40 L112 96" marker-end="url(#dg-at-mui)"/>
    <path d="M60 26 L128 88" marker-end="url(#dg-at-mui)"/>
    <path d="M44 54 L92 104" marker-end="url(#dg-at-mui)"/>
  </g>
  <!-- cây hoa đứng chắn sáng, bóng đổ trên lá nổi -->
  <path d="M120 150 V104" stroke="#8A8580" stroke-width="3"/>
  <circle cx="120" cy="100" r="7" fill="#EDE3CF"/>
  <ellipse cx="150" cy="154" rx="34" ry="6" fill="#2E4A3A"/>
  <ellipse cx="156" cy="154" rx="16" ry="4" fill="#3B1F14"/>
  <text x="138" y="174" fill="#8A8580" text-anchor="middle">bóng: shadow map</text>
  <!-- cánh sen, pháp tuyến N và hướng nhìn V ở mép -->
  <path d="M250 150 C 214 128, 214 78, 250 50 C 286 78, 286 128, 250 150 Z" fill="#C9C6BD"/>
  <path d="M250 150 C 214 128, 214 78, 250 50" fill="none" stroke="#F2D48A" stroke-width="4" stroke-linecap="round"/>
  <path d="M223 100 L193 100" stroke="#D4A94A" stroke-width="2" marker-end="url(#dg-at-mui2)"/>
  <text x="184" y="96" fill="#D4A94A" text-anchor="end">N</text>
  <path d="M223 100 L223 60" stroke="#EDE3CF" stroke-width="2" marker-end="url(#dg-at-mui)"/>
  <text x="229" y="58" fill="#EDE3CF">V (tới mắt)</text>
  <text x="300" y="112" fill="#F2D48A">N ⟂ V</text>
  <text x="300" y="128" fill="#F2D48A">→ mép sáng</text>
  <text x="300" y="144" fill="#8A8580">(fresnel)</text>
</svg>
