<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="dg-cq-mt-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-cq-mt-title">Nhìn từ trên xuống: nắng đến từ bên trái, nên nửa trăng quay về phía Mặt Trời luôn sáng. Trăng đi vòng quanh Trái Đất. Ở giữa Trái Đất và Mặt Trời, phía Trái Đất của trăng chìm trong đêm (trăng mới); đi một phần tư vòng thì nửa sáng (thượng huyền); ở phía bên kia thì sáng tròn (rằm). Pha là góc giữa hướng nắng và hướng về Trái Đất.</title>
  <defs>
    <marker id="dg-cq-mt-mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F2D48A"/>
    </marker>
  </defs>
  <!-- nắng từ bên trái -->
  <g stroke="#F2D48A" stroke-width="1.4" marker-end="url(#dg-cq-mt-mui)">
    <path d="M10 56 H58"/>
    <path d="M10 96 H58"/>
    <path d="M10 136 H58"/>
  </g>
  <text x="10" y="40" fill="#F2D48A">nắng</text>
  <!-- quỹ đạo và Trái Đất -->
  <circle cx="210" cy="96" r="58" fill="none" stroke="#8A8580" stroke-dasharray="3 4"/>
  <circle cx="210" cy="96" r="13" fill="#7E9CC8"/>
  <text x="210" y="124" fill="#7E9CC8" text-anchor="middle">Trái Đất</text>
  <!-- trăng ở ba chỗ: nửa trái (phía Mặt Trời) luôn sáng -->
  <g stroke="#8A8580">
    <circle cx="152" cy="96" r="9" fill="#1B2A4A"/>
    <circle cx="210" cy="38" r="9" fill="#1B2A4A"/>
    <circle cx="268" cy="96" r="9" fill="#1B2A4A"/>
  </g>
  <g fill="#EDE3CF">
    <path d="M152 87 A9 9 0 0 0 152 105 Z"/>
    <path d="M210 29 A9 9 0 0 0 210 47 Z"/>
    <path d="M268 87 A9 9 0 0 0 268 105 Z"/>
  </g>
  <text x="152" y="80" fill="#EDE3CF" text-anchor="middle">trăng mới</text>
  <text x="232" y="34" fill="#EDE3CF">thượng huyền</text>
  <text x="268" y="122" fill="#EDE3CF" text-anchor="middle">rằm</text>
  <text x="350" y="170" fill="#8A8580" text-anchor="end">pha = góc giữa hướng nắng và hướng về Trái Đất</text>
</svg>
