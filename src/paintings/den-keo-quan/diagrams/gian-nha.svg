<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="dg-kq-gn-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-kq-gn-title">Gạch bát tính từ tọa độ sàn: chia tọa độ cho cỡ viên, phần nguyên (floor) là số thứ tự viên, phần lẻ (fract) là vị trí trong viên. Gần mép phần lẻ là mạch vữa; hash của số thứ tự cho mỗi viên một màu.</title>
  <!-- tọa độ và lưới -->
  <g stroke="#8A8580" stroke-width="1">
    <path d="M20 150 H160 M20 150 V20"/>
    <path d="M60 150 V20 M100 150 V20 M140 150 V20 M20 110 H160 M20 70 H160 M20 30 H160" stroke-dasharray="2 3"/>
  </g>
  <circle cx="118" cy="88" r="4" fill="#F2D48A"/>
  <path d="M100 110 H118 V88" stroke="#F2D48A" fill="none" stroke-width="1.5"/>
  <text x="122" y="84" fill="#F2D48A">q</text>
  <text x="90" y="170" fill="#EDE3CF" text-anchor="middle">floor(q) = viên số mấy</text>
  <text x="160" y="16" fill="#EDE3CF" text-anchor="end">fract(q) = chỗ nào trong viên</text>
  <!-- viên gạch: màu theo hash, mạch vữa ở mép -->
  <rect x="196" y="30" width="148" height="120" fill="#8A8580" fill-opacity="0.55"/>
  <g>
    <rect x="200" y="34" width="44" height="36" fill="#B3261E" fill-opacity="0.75"/>
    <rect x="248" y="34" width="44" height="36" fill="#3B1F14"/>
    <rect x="296" y="34" width="44" height="36" fill="#B3261E" fill-opacity="0.6"/>
    <rect x="200" y="74" width="44" height="36" fill="#3B1F14" fill-opacity="0.85"/>
    <rect x="248" y="74" width="44" height="36" fill="#B3261E" fill-opacity="0.8"/>
    <rect x="296" y="74" width="44" height="36" fill="#3B1F14"/>
    <rect x="200" y="114" width="44" height="32" fill="#B3261E" fill-opacity="0.65"/>
    <rect x="248" y="114" width="44" height="32" fill="#3B1F14" fill-opacity="0.9"/>
    <rect x="296" y="114" width="44" height="32" fill="#B3261E" fill-opacity="0.7"/>
  </g>
  <text x="270" y="170" fill="#EDE3CF" text-anchor="middle">màu = hash(số viên) · mạch ở mép</text>
</svg>
