<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="dg-kq-nn-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-kq-nn-title">Luật nghịch đảo bình phương: cùng một chùm sáng từ ngọn nến, ở khoảng cách 2d trải ra trên diện tích gấp bốn lần ở khoảng cách d, nên mỗi chỗ chỉ còn một phần tư ánh sáng.</title>
  <!-- ngọn nến -->
  <path d="M34 98 C 26 90, 30 78, 34 70 C 38 78, 42 90, 34 98 Z" fill="#F2D48A"/>
  <path d="M34 98 C 30 93, 31 86, 34 81 C 37 86, 38 93, 34 98 Z" fill="#E0782E"/>
  <!-- chùm sáng -->
  <path d="M36 88 L330 18 L330 158 Z" fill="#D4A94A" fill-opacity="0.12"/>
  <g stroke="#D4A94A" stroke-width="1" stroke-dasharray="3 4">
    <path d="M36 88 L330 18"/>
    <path d="M36 88 L330 158"/>
  </g>
  <!-- vách ở d và ở 2d -->
  <rect x="180" y="53" width="8" height="70" fill="#F2D48A"/>
  <rect x="322" y="18" width="8" height="140" fill="#D4A94A" fill-opacity="0.5"/>
  <text x="184" y="44" fill="#F2D48A" text-anchor="middle">d: sáng 1</text>
  <text x="326" y="172" fill="#D4A94A" text-anchor="middle">2d: sáng ¼</text>
  <!-- khoảng cách -->
  <path d="M36 140 H184" stroke="#8A8580"/>
  <path d="M36 152 H326" stroke="#8A8580"/>
  <text x="110" y="134" fill="#8A8580" text-anchor="middle">d</text>
  <text x="250" y="146" fill="#8A8580" text-anchor="middle">2d</text>
  <text x="96" y="30" fill="#EDE3CF" text-anchor="middle">độ rọi ∝ 1 / d²</text>
</svg>
