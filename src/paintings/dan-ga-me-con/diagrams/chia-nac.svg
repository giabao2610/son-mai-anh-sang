<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" role="img" aria-labelledby="dg-dgmc-cn-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-dgmc-cn-title">Chia nấc trên cùng một trục. Trục ngang là độ sáng Lambert, dot(n, nắng): 0 ở mặt quay đi, 1 ở mặt nhìn thẳng vào nắng. Trục dọc là nấc, từ 0 (nấc tối) tới 1 (nấc sáng); với độ đậm mặc định, màu ra = màu in × (0,82 + 0,18 × nấc), nên nấc tối chỉ đậm hơn nấc sáng 18%. Đường chéo là ánh sáng liền (thí nghiệm Tô mịn): nấc bằng đúng độ sáng. Bậc thang là hai nấc của Bản màu: cùng độ sáng ấy, làm tròn xuống; dưới 0,5 là nấc tối, từ 0,5 trở lên là nấc sáng, đúng màu in. Bên phải là cùng một quả cầu tô hai cách: liền, và hai nấc.</title>
  <defs>
    <!-- Tô mịn: màu in nhân mix(1 − shade, 1, l), shade mặc định 0,18: phủ đen then mờ dần tới 18% ở phía khuất nắng -->
    <radialGradient id="dg-dgmc-cn-lien" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#0E0A08" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E0A08" stop-opacity="0.18"/>
    </radialGradient>
  </defs>
  <!-- trục -->
  <g stroke="#8A8580" fill="none">
    <path d="M46 28 V150 H252"/>
    <path d="M146 150 V34" stroke-dasharray="2 3"/>
  </g>
  <g fill="#8A8580" text-anchor="middle">
    <text x="46" y="164">0</text>
    <text x="146" y="164">0,5</text>
    <text x="246" y="164">1</text>
  </g>
  <text x="146" y="178" fill="#EDE3CF" text-anchor="middle">dot(n, nắng)</text>
  <!-- trục dọc là nấc q (0 … 1) mà Bản màu tính, không phải độ sáng: màu ra = màu in × mix(1 − shade, 1, q) -->
  <text x="46" y="20" fill="#EDE3CF" text-anchor="middle">nấc</text>
  <g fill="#8A8580" text-anchor="end">
    <text x="40" y="38">1</text>
    <text x="40" y="148">0</text>
  </g>
  <!-- ánh sáng liền (Tô mịn): đường chéo -->
  <path d="M46 144 L246 34" stroke="#C9C6BD" stroke-width="1.6"/>
  <text x="170" y="104.4" fill="#C9C6BD">liền (Tô mịn)</text>
  <!-- hai nấc: cùng độ sáng, làm tròn xuống; mép nấc mềm một chút -->
  <path d="M46 141 H141 C145 141 145 34 149 34 H246" fill="none" stroke="#D08E2A" stroke-width="3"/>
  <text x="118" y="134" fill="#D08E2A" text-anchor="middle">nấc tối</text>
  <text x="196" y="26" fill="#D08E2A" text-anchor="middle">nấc sáng</text>
  <!-- cùng một quả cầu, hai cách tô -->
  <circle cx="310" cy="56" r="24" fill="#D08E2A"/>
  <circle cx="310" cy="56" r="24" fill="url(#dg-dgmc-cn-lien)"/>
  <text x="310" y="96" fill="#EDE3CF" text-anchor="middle">liền</text>
  <!-- hai nấc: cả quả cầu là nấc tối (đậm hơn 18%), rồi vùng sáng (dot(n, nắng) ≥ 0,5, tính bằng số) là đúng màu in -->
  <circle cx="310" cy="128" r="24" fill="#D08E2A"/>
  <circle cx="310" cy="128" r="24" fill="#0E0A08" fill-opacity="0.18"/>
  <path d="M286 128.7 L286.1 129.3 L286.2 129.9 L286.3 130.4 L286.4 131 L286.6 131.5 L286.8 132 L287.1 132.5 L287.4 133 L287.7 133.4 L288 133.9 L288.4 134.3 L288.8 134.6 L289.3 135 L289.7 135.3 L290.2 135.6 L290.7 135.8 L291.3 136.1 L291.8 136.3 L292.4 136.4 L293 136.6 L293.7 136.7 L294.3 136.8 L295 136.8 L295.7 136.8 L296.4 136.8 L297.1 136.8 L297.8 136.7 L298.6 136.6 L299.3 136.4 L300.1 136.3 L300.9 136.1 L301.6 135.8 L302.4 135.6 L303.2 135.3 L304 135 L304.8 134.7 L305.6 134.3 L306.3 133.9 L307.1 133.5 L307.9 133 L308.6 132.6 L309.4 132.1 L310.1 131.6 L310.9 131 L311.6 130.5 L312.3 129.9 L313 129.3 L313.6 128.7 L314.3 128.1 L314.9 127.4 L315.5 126.8 L316.1 126.1 L316.7 125.5 L317.2 124.8 L317.8 124.1 L318.3 123.4 L318.7 122.7 L319.1 122 L319.6 121.3 L319.9 120.6 L320.3 119.9 L320.6 119.2 L320.9 118.4 L321.1 117.7 L321.4 117 L321.5 116.4 L321.7 115.7 L321.8 115 L321.9 114.3 L321.9 113.7 L322 113.1 L321.9 112.4 L321.9 111.8 L321.8 111.2 L321.7 110.7 L321.5 110.1 L321.4 109.6 L321.1 109.1 L320.9 108.6 L320.6 108.1 L320.3 107.6 L319.9 107.2 L319.6 106.8 L319.1 106.5 L318.7 106.1 L318.3 105.8 L317.8 105.5 L317.2 105.3 L316.7 105 L316.1 104.8 L315.5 104.7 L314.8 104.5 L314.1 104.4 L313.4 104.2 L312.7 104.1 L311.9 104.1 L311.2 104 L310.5 104 L309.7 104 L309 104 L308.3 104.1 L307.5 104.1 L306.8 104.2 L306.1 104.3 L305.4 104.5 L304.7 104.6 L303.9 104.8 L303.2 105 L302.5 105.2 L301.8 105.4 L301.2 105.7 L300.5 106 L299.8 106.3 L299.2 106.6 L298.5 106.9 L297.9 107.3 L297.2 107.7 L296.6 108.1 L296 108.5 L295.4 108.9 L294.9 109.4 L294.3 109.8 L293.8 110.3 L293.2 110.8 L292.7 111.4 L292.2 111.9 L291.7 112.4 L291.3 113 L290.8 113.6 L290.4 114.2 L290 114.8 L289.6 115.4 L289.2 116 L288.8 116.7 L288.5 117.3 L288.2 118 L287.9 118.7 L287.6 119.3 L287.4 120 L287.1 120.7 L286.9 121.4 L286.7 122.1 L286.6 122.8 L286.4 123.6 L286.3 124.3 L286.2 125 L286.1 125.7 L286 126.5 L286 127.2 L286 127.9 Z" fill="#D08E2A"/>
  <text x="310" y="168" fill="#EDE3CF" text-anchor="middle">hai nấc</text>
  <!-- số thật của hai nấc (núm shade mặc định 0,18): nấc tối chỉ đậm hơn nấc sáng 18% -->
  <text x="146" y="198" fill="#C9C6BD" text-anchor="middle">màu ra = màu in × (0,82 + 0,18 × nấc)</text>
</svg>
