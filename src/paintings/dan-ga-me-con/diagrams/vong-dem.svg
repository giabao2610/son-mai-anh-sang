<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="dg-dgmc-vd-title" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12">
  <title id="dg-dgmc-vd-title">Vòng đệm của thóc. Bể hạt là một dãy ô cấp sẵn một lần, nối đuôi thành vòng; mỗi ô là một hạt, do một luồng GPU giữ. Hai nắm vừa rắc là hai đoạn liền trên vòng (đỏ là nắm thứ nhất, vàng là nắm thứ hai); các ô xám là hạt cũ hơn. Mũi tên chỉ đầu nắm kế tiếp: nắm mới khởi tạo lại các ô ngay sau nắm vừa rắc, tức những hạt cũ nhất. Bên phải: mảng mười mỏ của gà con là uniform, JS ghi mỗi khung; luật của mỗi hạt đọc mảng ấy, và mỗi luồng chỉ đọc, ghi ô của chính nó.</title>
  <defs>
    <marker id="dg-dgmc-vd-mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#EDE3CF"/>
    </marker>
  </defs>
  <!-- vòng đệm: 24 ô (thật ra hàng nghìn) -->
  <!-- hạt cũ hơn: cũ nhất ngay sau con trỏ -->
  <g fill="#8A8580" fill-opacity="0.45">
    <path d="M85.3 154 A62 62 0 0 1 70.7 152.1 L75.6 132.7 A42 42 0 0 0 85.5 134 Z"/>
    <path d="M69.2 151.7 A62 62 0 0 1 55.6 146.1 L65.4 128.6 A42 42 0 0 0 74.6 132.4 Z"/>
    <path d="M54.4 145.3 A62 62 0 0 1 42.7 136.4 L56.7 122.1 A42 42 0 0 0 64.6 128.1 Z"/>
    <path d="M41.6 135.3 A62 62 0 0 1 32.7 123.6 L49.9 113.4 A42 42 0 0 0 55.9 121.3 Z"/>
    <path d="M31.9 122.4 A62 62 0 0 1 26.3 108.8 L45.6 103.4 A42 42 0 0 0 49.4 112.6 Z"/>
    <path d="M25.9 107.3 A62 62 0 0 1 24 92.7 L44 92.5 A42 42 0 0 0 45.3 102.4 Z"/>
    <path d="M24 91.3 A62 62 0 0 1 25.9 76.7 L45.3 81.6 A42 42 0 0 0 44 91.5 Z"/>
    <path d="M26.3 75.2 A62 62 0 0 1 31.9 61.6 L49.4 71.4 A42 42 0 0 0 45.6 80.6 Z"/>
    <path d="M32.7 60.4 A62 62 0 0 1 41.6 48.7 L55.9 62.7 A42 42 0 0 0 49.9 70.6 Z"/>
    <path d="M42.7 47.6 A62 62 0 0 1 54.4 38.7 L64.6 55.9 A42 42 0 0 0 56.7 61.9 Z"/>
    <path d="M55.6 37.9 A62 62 0 0 1 69.2 32.3 L74.6 51.6 A42 42 0 0 0 65.4 55.4 Z"/>
    <path d="M70.7 31.9 A62 62 0 0 1 85.3 30 L85.5 50 A42 42 0 0 0 75.6 51.3 Z"/>
    <path d="M86.7 30 A62 62 0 0 1 101.3 31.9 L96.4 51.3 A42 42 0 0 0 86.5 50 Z"/>
  </g>
  <!-- nắm thứ nhất: một đoạn liền -->
  <g fill="#B9472E">
    <path d="M102.8 32.3 A62 62 0 0 1 116.4 37.9 L106.6 55.4 A42 42 0 0 0 97.4 51.6 Z"/>
    <path d="M117.6 38.7 A62 62 0 0 1 129.3 47.6 L115.3 61.9 A42 42 0 0 0 107.4 55.9 Z"/>
    <path d="M130.4 48.7 A62 62 0 0 1 139.3 60.4 L122.1 70.6 A42 42 0 0 0 116.1 62.7 Z"/>
    <path d="M140.1 61.6 A62 62 0 0 1 145.7 75.2 L126.4 80.6 A42 42 0 0 0 122.6 71.4 Z"/>
    <path d="M146.1 76.7 A62 62 0 0 1 148 91.3 L128 91.5 A42 42 0 0 0 126.7 81.6 Z"/>
    <path d="M148 92.7 A62 62 0 0 1 146.1 107.3 L126.7 102.4 A42 42 0 0 0 128 92.5 Z"/>
  </g>
  <!-- nắm thứ hai, vừa rắc: đoạn liền ngay sau nắm thứ nhất -->
  <g fill="#E0AC3A">
    <path d="M145.7 108.8 A62 62 0 0 1 140.1 122.4 L122.6 112.6 A42 42 0 0 0 126.4 103.4 Z"/>
    <path d="M139.3 123.6 A62 62 0 0 1 130.4 135.3 L116.1 121.3 A42 42 0 0 0 122.1 113.4 Z"/>
    <path d="M129.3 136.4 A62 62 0 0 1 117.6 145.3 L107.4 128.1 A42 42 0 0 0 115.3 122.1 Z"/>
    <path d="M116.4 146.1 A62 62 0 0 1 102.8 151.7 L97.4 132.4 A42 42 0 0 0 106.6 128.6 Z"/>
    <path d="M101.3 152.1 A62 62 0 0 1 86.7 154 L86.5 134 A42 42 0 0 0 96.4 132.7 Z"/>
  </g>
  <!-- chiều đi của con trỏ: theo chiều kim đồng hồ -->
  <path d="M54.1 100.5 A33 33 0 0 1 62.7 68.7" fill="none" stroke="#8A8580" stroke-width="1.2" marker-end="url(#dg-dgmc-vd-mui)"/>
  <text x="86" y="96" fill="#EDE3CF" text-anchor="middle">vòng đệm</text>
  <text x="150.4" y="56" fill="#EDE3CF">nắm 1</text>
  <text x="133.8" y="155.1" fill="#EDE3CF">nắm 2</text>
  <path d="M86 178 L86 157" stroke="#EDE3CF" stroke-width="1.6" marker-end="url(#dg-dgmc-vd-mui)"/>
  <text x="86" y="192" fill="#EDE3CF" text-anchor="middle">đầu nắm kế tiếp</text>
  <path d="M61.5 151.1 L56.9 162.2" stroke="#8A8580"/>
  <text x="2" y="176" fill="#8A8580" font-size="11">hạt cũ nhất</text>
  <!-- mảng mười mỏ (uniform) đi vào luật của mỗi hạt -->
  <text x="279" y="24" fill="#EDE3CF" text-anchor="middle">mười mỏ (uniform)</text>
  <g fill="#E0AC3A">
    <rect x="214" y="34" width="11" height="11" rx="2"/>
    <rect x="227" y="34" width="11" height="11" rx="2"/>
    <rect x="240" y="34" width="11" height="11" rx="2"/>
    <rect x="253" y="34" width="11" height="11" rx="2"/>
    <rect x="266" y="34" width="11" height="11" rx="2"/>
    <rect x="279" y="34" width="11" height="11" rx="2"/>
    <rect x="292" y="34" width="11" height="11" rx="2"/>
    <rect x="305" y="34" width="11" height="11" rx="2"/>
    <rect x="318" y="34" width="11" height="11" rx="2"/>
    <rect x="331" y="34" width="11" height="11" rx="2"/>
  </g>
  <text x="279" y="62" fill="#8A8580" text-anchor="middle" font-size="11">JS ghi mỗi khung</text>
  <path d="M279 68 V92" stroke="#EDE3CF" stroke-width="1.4" marker-end="url(#dg-dgmc-vd-mui)"/>
  <rect x="208" y="96" width="142" height="44" rx="8" fill="none" stroke="#EDE3CF"/>
  <text x="279" y="114" fill="#EDE3CF" text-anchor="middle">luật của mỗi hạt</text>
  <text x="279" y="130" fill="#8A8580" text-anchor="middle" font-size="11">mỏ đang mổ, gần thì ăn</text>
  <!-- mỗi luồng chỉ đọc, ghi ô của mình: mũi tên hai đầu -->
  <path d="M149.1 67.5 C185.1 67.5 180 118 205 118" fill="none" stroke="#B9472E" stroke-width="1.4" marker-start="url(#dg-dgmc-vd-mui)" marker-end="url(#dg-dgmc-vd-mui)"/>
  <text x="279" y="164" fill="#EDE3CF" text-anchor="middle" font-size="11">mỗi luồng chỉ đọc, ghi</text>
  <text x="279" y="178" fill="#EDE3CF" text-anchor="middle" font-size="11">ô của chính nó</text>
</svg>
