name: Kiểm thử và deploy lên GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu; riêng job deploy xin thêm quyền ghi Pages.
# Mọi action được ghim theo SHA của commit (chú thích ghi phiên bản): tag có thể bị dời, SHA thì không.
permissions:
  contents: read

# Mỗi lúc chỉ một lần deploy; lần deploy production đang chạy được chạy cho xong.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Cổng chặn phần 1: unit, luật, hợp đồng, build, đóng gói Pages. E2e ở job riêng: từ GĐ 6 có hai bức, e2e chung chạy cho mỗi
    # bức nên dài gấp đôi (spec §13).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit, luật và hợp đồng (Vitest)
        run: npm test

      - name: Build (Vite, base /son-mai-anh-sang/)
        run: npm run build

      - name: Đóng gói dist cho Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Cổng chặn phần 2: tranh tĩnh + WebGL2 trên SwiftShader (kèm a11y), chia hai phần chạy song song theo từng test
  # (--fully-parallel: chia theo test, không theo file, nên hai phần lệch nhau ít). GĐ 3 đo được khoảng 12 phút e2e cho một bức.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (mỗi phần tự build; nhanh hơn chuyển dist qua artifact, và không thêm action mới)
        run: npm run build

      - name: Cài Chromium headless shell và thư viện hệ thống
        run: npx playwright install --with-deps --only-shell chromium

      - name: E2E chặn · tranh tĩnh + WebGL2 trên SwiftShader (kèm a11y) · phần ${{ matrix.shard }}/2
        run: npx playwright test --project=static --project=webgl2-swiftshader --shard=${{ matrix.shard }}/2 --fully-parallel

      - name: Giữ ảnh chụp và trace của e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e/.results/
          # e2e/.results là thư mục ẩn: upload-artifact (từ v4.4) mặc định bỏ file ẩn, nên trước đây không lượt nào có artifact.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # WebGPU trên SwiftShader (Chromium đầy đủ): KHÔNG chặn, chia hai phần như e2e chặn. Tách job riêng từ GĐ 3: hỏng hay treo cũng
  # không kéo cổng chặn theo. Trần 40 phút cho mỗi phần: trước khi chia, riêng e2e đã mất khoảng 18,5 phút cho một bức, còn bước cài
  # Chromium kèm thư viện hệ thống lúc 19 giây, lúc gần 7 phút (PR #5 bị hủy ở trần 25 phút dù mọi test đã chạy đều qua).
  e2e-webgpu:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (Vite, base /son-mai-anh-sang/)
        run: npm run build

      - name: Cài Chromium đầy đủ và thư viện hệ thống
        run: npx playwright install --with-deps --no-shell chromium

      - name: E2E không chặn · WebGPU trên SwiftShader · phần ${{ matrix.shard }}/2
        run: npx playwright test --project=webgpu-swiftshader --shard=${{ matrix.shard }}/2 --fully-parallel

      - name: Giữ ảnh chụp và trace của e2e WebGPU
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-webgpu-${{ matrix.shard }}
          path: e2e/.results/
          include-hidden-files: true # thư mục ẩn, như ở job e2e
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    # Chỉ deploy từ main, và chỉ khi build và CẢ HAI phần e2e chặn đều qua (không chờ e2e-webgpu).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
