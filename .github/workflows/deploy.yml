name: Kiểm thử và deploy lên GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu; riêng job deploy xin thêm quyền ghi Pages.
# Mọi action được ghim theo SHA của commit (chú thích ghi phiên bản): tag có thể bị dời, SHA thì không.
permissions:
  contents: read

# Mỗi lúc chỉ một lần deploy; lần deploy production đang chạy được chạy cho xong.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit, luật và hợp đồng (Vitest)
        run: npm test

      - name: Build (Vite, base /son-mai-anh-sang/)
        run: npm run build

      - name: Cài Chromium (đầy đủ + headless shell) và thư viện hệ thống
        run: npx playwright install --with-deps chromium

      - name: E2E chặn · tranh tĩnh + WebGL2 trên SwiftShader
        run: npx playwright test --project=static --project=webgl2-swiftshader

      # Playwright xóa thư mục output ở đầu mỗi lần chạy, nên lần này ghi vào thư mục con riêng.
      - name: E2E không chặn · WebGPU trên SwiftShader (Chromium đầy đủ)
        continue-on-error: true
        run: npx playwright test --project=webgpu-swiftshader --output=e2e/.results/webgpu-swiftshader

      - name: Giữ ảnh chụp và trace của e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: e2e/.results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Đóng gói dist cho Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    # Chỉ deploy từ main, và chỉ khi mọi bước chặn của job build đều qua.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
