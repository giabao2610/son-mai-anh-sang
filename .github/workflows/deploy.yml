name: Kiểm thử và deploy lên GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu; riêng job deploy xin thêm quyền ghi Pages.
permissions:
  contents: read

# Mỗi lúc chỉ một lần deploy; lần deploy production đang chạy được chạy cho xong.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit, luật và hợp đồng (Vitest)
        run: npm test

      - name: Build (Vite, base /son-mai-anh-sang/)
        run: npm run build

      - name: Cài Chromium (đầy đủ + headless shell) và thư viện hệ thống
        run: npx playwright install --with-deps chromium

      - name: E2E chặn · tranh tĩnh + WebGL2 trên SwiftShader
        run: npx playwright test --project=static --project=webgl2-swiftshader

      # Playwright xóa thư mục output ở đầu mỗi lần chạy, nên lần này ghi vào thư mục con riêng.
      - name: E2E không chặn · WebGPU trên SwiftShader (Chromium đầy đủ)
        continue-on-error: true
        run: npx playwright test --project=webgpu-swiftshader --output=e2e/.results/webgpu-swiftshader

      - name: Giữ ảnh chụp và trace của e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/.results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Đóng gói dist cho Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Chỉ deploy từ main, và chỉ khi mọi bước chặn của job build đều qua.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
