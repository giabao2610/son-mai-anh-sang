  <body data-painting="cung-que" data-state="poster">
    <img
      class="poster"
      data-poster
      src="/paintings/cung-que/poster.webp"
      width="1600"
      height="1000"
      alt="Tranh sơn mài cung trăng: chú Cuội ngồi gốc cây đa trên một hành tinh nhỏ, con trâu gặm cỏ, Trái Đất treo trên trời."

    <div class="stage" data-stage></div>
    <main class="frame">
      <div class="top">
        <header>
          <small>Sơn Mài Ánh Sáng · Bức 3</small>

          <button data-badge hidden type="button" aria-expanded="false" aria-controls="badge-note"></button>
          <p id="badge-note" data-badge-note aria-live="polite"></p>
        </div>
      </div>
      <section data-static aria-live="polite"></section>
      <p class="hint" data-hint aria-live="polite"></p>
      <footer class="foot">
        <figure class="poem">
          <blockquote data-poem>
            <p>Thằng Cuội ngồi gốc cây đa</p>
            <p>Để trâu ăn lúa gọi cha ời ời</p>
          </blockquote>
          <figcaption><cite>Ca dao</cite></figcaption>
        </figure>
        <div class="marks">
          <svg data-moon viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true"></svg>
          <span class="dau" data-seal></span>
        </div>
      </footer>
    </main>
    <script type="module">
      import { boot } from '/src/engine/boot.js';
      import entry from '/src/paintings/cung-que/index.js';
